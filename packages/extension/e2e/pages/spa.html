<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SPA fixture</title>
    <style>body { padding: 80px 320px 80px 300px; } /* clear of the floating panels */</style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      let n = 0;
      // Simulates a framework re-render: throws away and recreates the subtree.
      window.rerender = () => {
        n++;
        document.getElementById('app').innerHTML = `<h1 id="headline">Original headline</h1><p class="note">render ${n}</p>`;
      };
      window.rerender();
    </script>
  </body>
</html>
